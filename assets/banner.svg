<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" role="img" aria-label="supportal — web-chat to Telegram relay">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0"   stop-color="#60A5FA"/>
      <stop offset="0.35" stop-color="#22D3EE"/>
      <stop offset="0.7" stop-color="#A78BFA"/>
      <stop offset="1"   stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161F"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- terminal window -->
  <rect x="16" y="16" width="1168" height="360" rx="18" fill="url(#screen)" stroke="#2A3240" stroke-width="1.5"/>
