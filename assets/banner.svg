    <tspan fill="#3FB950">$ </tspan><tspan fill="#8B949E">web-chat user </tspan><tspan fill="#22D3EE">⇄</tspan><tspan fill="#8B949E"> support operator in Telegram</tspan><tspan fill="#484F58">  #</tspan><tspan fill="#6E7781"> drop-in FastAPI relay</tspan><tspan fill="#58A6FF" font-weight="bold"> ▋</tspan>
