# supportal — relay "web-chat ↔ support operator in Telegram".
# Co-located with the product (same docker network) or a separate host reachable by the product over the network.
services:
  supportal:
    build: .
    image: supportal:local
    container_name: supportal
    restart: unless-stopped
    env_file: .env
    ports:
      - "8500:8500"   # ingress from the product; Telegram — long-polling (egress), no inbound webhook needed
