[project]
name = "supportal"
version = "0.1.0"
description = "Embeddable relay: web-chat user ⇄ support operator in Telegram (forum topics)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergey Istomin", email = "sergey.istomin@gmail.com" }]
keywords = [
    "telegram", "support", "livechat", "relay", "fastapi", "aiogram",
    "widget", "customer-support", "helpdesk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiogram>=3.13", # Telegram Bot API (forum topics, long-polling) — operator side
    "aiohttp-socks>=0.8", # proxy connector for aiogram (egress to Telegram via a forward-proxy) — needed when SUPPORT_TG_PROXY is set
    "httpx>=0.27", # callback to the product (operator reply → the user's live session)
    "pydantic>=2.8", # HTTP-contract DTOs (the embedding boundary)
    "pyyaml>=6",
]

[project.optional-dependencies]
# Reference PostgreSQL backend (SUPPORT_DB_URL=postgresql://…). Not needed for the default SQLite store.
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/Neanderthal/supportal"
Repository = "https://github.com/Neanderthal/supportal"
Issues = "https://github.com/Neanderthal/supportal/issues"
Changelog = "https://github.com/Neanderthal/supportal/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]   # tests/ import the supportal package from the repo root

[tool.coverage.run]
source = ["supportal"]   # measure the package, not tests/ or examples/
# The reference Postgres backend is exercised by an integration test against a live DB (test_postgres_store_unit.py,
# skipped without SUPPORT_TEST_PG_URL / in CI), not unit tests — so it's excluded from the unit-coverage gate.
omit = ["supportal/store_pg.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85          # CI (and `pytest --cov`) fails below this; keeps the suite from regressing

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin ruff's default set (E4/E7/E9/F) version-independently.
select = ["E4", "E7", "E9", "F"]
# Intentional compact style: E701 `if x: y`, E702 `a; b`, E401 `import a, b`.
ignore = ["E701", "E702", "E401"]
